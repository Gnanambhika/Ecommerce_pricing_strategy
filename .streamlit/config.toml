# Streamlit configuration. Contains no secrets; safe to commit.
# Secrets (none are needed by this app) would go in .streamlit/secrets.toml, which is git-ignored.

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f7f7f4"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b0b0b"

[server]
headless = true
maxUploadSize = 50
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
